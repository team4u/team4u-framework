name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build
        run: mvn -DskipTests clean install
      - name: Test
        run: mvn test
      - name: Benchmark package
        run: mvn -q -f benchmarks/pom.xml clean package
      - name: Consumer contracts
        run: mvn -Pconsumer-it -DskipTests verify
      - name: Release contracts
        run: mvn -Prelease-contracts -DskipTests verify
      - name: Release artifact contracts
        run: scripts/check-release-contracts.sh
      - name: Performance claims
        run: scripts/check-performance-claims.sh
      - name: Release package
        run: mvn -Prelease -DskipTests package
